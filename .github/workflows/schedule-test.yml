name: Schedule test (temporary)
# Does nothing but print the time: checks whether GitHub fires scheduled runs for this repo. Delete after testing.
on:
  schedule:
    - cron: "15 17 * * *"
    - cron: "25 17 * * *"
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "scheduled for ${{ github.event.schedule }}, started $(date -u +%T) UTC"
