name: Daily job scout

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving time.
    # 14:17 UTC = 6:17 AM PST (Nov–Mar) = 7:17 AM PDT (Mar–Nov).
    # For ~6 AM during PDT instead, use "17 13 * * *" (= 5:17 AM PST in winter).
    # GitHub scheduled runs are best-effort: they can start hours late or be skipped, most often on the hour.
    # So there are two backup slots; each one exits right away if a run already succeeded today (UTC).
    - cron: "17 14 * * *"
    - cron: "47 15 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Person's folder name, or 'all'"
        default: "all"
        required: true
      dry_run:
        description: "Dry run (write nothing)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # lets the backup slots see whether today's run already succeeded

concurrency:
  group: jobscout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip if today's run already succeeded (scheduled slots only)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "done=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml --status success --limit 20 --json createdAt \
                --jq "[.[] | select(.createdAt | startswith(\"$today\"))] | length")
          if [ "$n" -gt 0 ]; then echo "Already ran successfully today; skipping."; echo "done=yes" >> "$GITHUB_OUTPUT"
          else echo "done=no" >> "$GITHUB_OUTPUT"; fi
      # Supply chain: everything this job downloads is pinned, because it runs with the secrets.
      # Actions by full commit SHA (a tag can be moved), Python packages by hash, Claude Code by version + SHA-256.
      # Dependabot (.github/dependabot.yml) proposes updates to these pins as pull requests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.guard.outputs.done != 'yes'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.guard.outputs.done != 'yes'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python packages (hash-checked)
        if: steps.guard.outputs.done != 'yes'
        run: pip install --require-hashes --no-deps -r requirements.txt
      - name: Install Claude Code (pinned version, checksum-verified; uses your Claude subscription)
        if: steps.guard.outputs.done != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_VERSION: "2.1.317"
          CLAUDE_CODE_SHA256: "eb224419e344575faa4a1f39b290b649425a10cd5ee2ef1d003480cd9ae57eb0"  # linux-x64, from its release manifest
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN secret: falling back to the Anthropic API key."; exit 0
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          echo "$CLAUDE_CODE_SHA256  $HOME/.local/bin/claude" | sha256sum -c -
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
      - name: Run
        if: steps.guard.outputs.done != 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JOBSCOUT_ROOT_FOLDER_ID: ${{ secrets.JOBSCOUT_ROOT_FOLDER_ID }}
          PROFILE: ${{ inputs.profile || 'all' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        # Each profile runs isolated; one failing profile doesn't stop the others.
        # Logs show counts only, with people shown as profile-1, profile-2 (this repo is public, so are its Actions logs).
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then export JOBSCOUT_LLM_BACKEND=claude-code; else export JOBSCOUT_LLM_BACKEND=api; fi
          python -m jobscout run --profile "$PROFILE" $DRY_RUN
