[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscout"
version = "0.1.0"
description = "Daily job scout: finds new postings, judges them against a free-text brief with Claude, appends them to a Google Sheet."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.3,<3",
  "gspread>=6.1,<7",
  "google-auth>=2.30",
  "requests>=2.31",
  "pydantic>=2.7,<3",
  "httpx>=0.27",
  "pyyaml>=6",
  "pypdf>=4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobscout = "jobscout.cli:main"

[tool.setuptools.packages.find]
include = ["jobscout*"]
